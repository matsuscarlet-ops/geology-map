<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地質図マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { --ink:#22313a; --paper:#fbfaf7; --line:#c9c5bb; --accent:#2f5d62; }
  html, body { height:100%; margin:0; font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif; color:var(--ink); }
  #map { height:100%; }
  .panel {
    position:absolute; z-index:1000; top:12px; right:12px; width:min(250px, calc(100vw - 80px));
    background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:12px 14px;
    font-size:14px; line-height:1.6;
  }
  .toggle {
    display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:32px;
    margin:0; padding:0; border:0; background:none; color:inherit; font:inherit; font-size:15px; font-weight:700;
    text-align:left; cursor:pointer;
  }
  .toggle:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .panel.collapsed { width:auto; padding:4px 12px; }
  #panelBody { margin-top:6px; }
  [hidden] { display:none !important; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0; }
  .row label { white-space:nowrap; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  select { font:inherit; padding:2px 4px; }
  input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .hint { margin:8px 0 0; font-size:12px; color:#5b6770; }
  .error { margin:8px 0 0; font-size:12px; color:#9a3412; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="panel">
  <button type="button" class="toggle" id="panelToggle" aria-expanded="true" aria-controls="panelBody">
    <span>地質図マップ</span><span id="chev" aria-hidden="true">▲</span>
  </button>
  <div id="panelBody">
  <div class="row">
    <label><input type="checkbox" id="show" checked> 地質図を表示</label>
  </div>
  <div class="row">
    <label for="opacity">濃さ</label>
    <input type="range" id="opacity" min="0" max="100" value="60">
  </div>
  <div class="row">
    <label for="base">下の地図</label>
    <select id="base">
      <option value="pale">淡色地図</option>
      <option value="photo">航空写真</option>
    </select>
  </div>
  <p class="hint">地図をタップすると、その地点の岩石と形成時代が出ます。20万分の1の地質図なので、拡大しすぎると粗くなります。</p>
  <p class="error" id="error" hidden>地質図を読み込めませんでした。ネットワークを確認してください。</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const gsi = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>';

  const bases = {
    pale: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { maxZoom: 18, attribution: gsi }),
    photo: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { maxZoom: 18, attribution: gsi }),
  };

  // 産総研のタイルはURLの並びが {z}/{y}/{x} です
  const geology = L.tileLayer('https://gbank.gsj.jp/seamless/v2/api/1.0/tiles/{z}/{y}/{x}.png', {
    minZoom: 3,
    maxNativeZoom: 13,
    maxZoom: 18,
    opacity: 0.6,
    attribution: '地質: 産総研 地質調査総合センター 20万分の1日本シームレス地質図V2',
  });

  const map = L.map('map', { minZoom: 4 }).setView([36.2, 137.5], 6);
  let currentBase = bases.pale.addTo(map);
  geology.addTo(map);

  const $ = id => document.getElementById(id);

  $('show').addEventListener('change', e => {
    if (e.target.checked) geology.addTo(map); else map.removeLayer(geology);
  });
  $('opacity').addEventListener('input', e => geology.setOpacity(e.target.value / 100));
  $('base').addEventListener('change', e => {
    map.removeLayer(currentBase);
    currentBase = bases[e.target.value].addTo(map);
    currentBase.bringToBack();
  });

  let errors = 0;
  geology.on('loading', () => { errors = 0; });
  geology.on('tileerror', () => { errors++; });
  geology.on('load', () => { $('error').hidden = errors === 0; });

  // パネルの開閉（スマホ幅では最初から閉じておく）
  const panel = $('panel'), panelBody = $('panelBody'), panelToggle = $('panelToggle');
  function setOpen(open) {
    panelBody.hidden = !open;
    panel.classList.toggle('collapsed', !open);
    panelToggle.setAttribute('aria-expanded', String(open));
    $('chev').textContent = open ? '▲' : '▼';
  }
  setOpen(!window.matchMedia('(max-width: 600px)').matches);
  panelToggle.addEventListener('click', () => setOpen(panelBody.hidden));

  // 地図をタップした地点の凡例（岩石・形成時代）を取得して表示する
  function renderLegend(d) {
    const box = document.createElement('div');
    if (!d || !d.symbol) {
      box.textContent = 'この地点のデータはありません（海や範囲外です）。';
      return box;
    }
    [
      ['岩相', d.lithology_ja],
      ['大区分', d.group_ja],
      ['形成時代', d.formationAge_ja],
      ['記号', d.symbol],
    ].forEach(([label, value]) => {
      const p = document.createElement('div');
      p.style.margin = '2px 0';
      const b = document.createElement('b');
      b.textContent = label + '：';
      p.appendChild(b);
      p.appendChild(document.createTextNode(value || '不明'));
      box.appendChild(p);
    });
    return box;
  }

  map.on('click', async e => {
    const popup = L.popup().setLatLng(e.latlng).setContent('読み込み中…').openOn(map);
    const url = 'https://gbank.gsj.jp/seamless/v2/api/1.0/legend.json?point='
      + e.latlng.lat.toFixed(6) + ',' + e.latlng.lng.toFixed(6);
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      popup.setContent(renderLegend(await res.json()));
    } catch (err) {
      console.error(err);
      popup.setContent('情報を取得できませんでした。');
    }
  });
</script>
</body>
</html>
